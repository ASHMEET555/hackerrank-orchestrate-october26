# step_rules.yaml — Declarative rules mapping states and categories to findings, remediations, and verifications
# Derived from AGENTS.md §6.4-§6.5, CONTRACT_SPEC.md, and dataset/deletion_rules.csv.

# Explicit mapping of all engine rule labels to deletion_rules.csv source rows and contract clauses
rule_contract_mapping:
  rule_01:
    source_type: "deletion_rules.csv"
    quoted_row: "rule_01,USER_PROFILE,Always,DELETE"
  rule_03:
    source_type: "deletion_rules.csv"
    quoted_row: "rule_03,SEARCH_INDEX_ENTRY,Always,DELETE"
  rule_05:
    source_type: "deletion_rules.csv"
    quoted_row: 'rule_05,SUPPORT_MESSAGE,"Conversation contains shared customer, agent, or order context that must be retained",REDACT'
  rule_06:
    source_type: "deletion_rules.csv"
    quoted_row: 'rule_06,SUPPORT_ATTACHMENT,"Attachment belongs only to the deletion subject",DELETE'
  rule_07:
    source_type: "deletion_rules.csv"
    quoted_row: 'rule_07,ANALYTICS_PROFILE,"Record is still attributable to a user",ANONYMIZE'
  rule_09:
    source_type: "deletion_rules.csv"
    quoted_row: "rule_09,USER_EXPORT,Always,DELETE"
  rule_10:
    source_type: "deletion_rules.csv"
    quoted_row: "rule_10,MARKETING_PROFILE,Always,DELETE"
  rule_12:
    source_type: "deletion_rules.csv"
    quoted_row: 'rule_12,SECURITY_AUDIT_LOG,"Record is within the supplied retention period",RETAIN'
  rule_14:
    source_type: "deletion_rules.csv"
    quoted_row: 'rule_14,BACKUP_ARCHIVE,"Restore access can be blocked",RETAIN'
  rule_15:
    source_type: "deletion_rules.csv"
    quoted_row: 'rule_15,ACCOUNT_TOMBSTONE,"Account is deleted and only a stable internal user_id is needed to preserve references to retained records",REDACT'
  rule_flow:
    source_type: "CONTRACT_SPEC.md & AGENTS.md §6.4"
    quoted_row: 'REPORT_ACTIVE_DATA_FLOW, DISABLE_DATA_FLOW, VERIFY_DATA_FLOW_DISABLED: "An active process can copy or recreate the user data"'
  UNKNOWN_CLASSIFICATION:
    source_type: "CONTRACT_SPEC.md §4.6 & AGENTS.md §6.5"
    quoted_row: 'Classification error: unmapped or ungrounded data category logged to failures.md'

phases:
  - FINDING
  - REMEDIATION
  - VERIFICATION

# Mapping from violation/observation type to Finding operation & expected state
findings:
  remaining_record:
    operation: REPORT_REMAINING_RECORD
    state: PRESENT
    trigger: Record exists where required action is DELETE, or undeleted copy found.
  exposed_pii:
    operation: REPORT_EXPOSED_PII
    state: PRESENT
    trigger: Record exists where required action is REDACT or ANONYMIZE, but identifying attributes remain unredacted/unanonymized.
  active_data_flow:
    operation: REPORT_ACTIVE_DATA_FLOW
    state: ACTIVE
    trigger: Sync connector, stream, or bridge is enabled or active for the subject.
  restore_risk:
    operation: REPORT_RESTORE_RISK
    state: ACTIVE
    trigger: Backup or archive entry allows restore (restore_allowed == true or eligible without deletion_block).

# Mapping from required action to Remediation operation & target state
remediations:
  DELETE:
    operation: DELETE_RECORD
    state: ABSENT
    verification_operation: VERIFY_RECORD_ABSENT
    verification_state: ABSENT
  REDACT:
    operation: REDACT_RECORD
    state: REDACTED
    verification_operation: VERIFY_RECORD_REDACTED
    verification_state: REDACTED
  ANONYMIZE:
    operation: ANONYMIZE_RECORD
    state: ANONYMIZED
    verification_operation: VERIFY_RECORD_ANONYMIZED
    verification_state: ANONYMIZED
  DISABLE_DATA_FLOW:
    operation: DISABLE_DATA_FLOW
    state: DISABLED
    verification_operation: VERIFY_DATA_FLOW_DISABLED
    verification_state: DISABLED
  BLOCK_RESTORE:
    operation: BLOCK_RESTORE
    state: BLOCKED
    verification_operation: VERIFY_RESTORE_BLOCKED
    verification_state: BLOCKED

# Mapping for RETAIN records (policy-required retained data)
retained_verifications:
  RETAIN:
    operation: VERIFY_RECORD_PRESENT
    state: PRESENT

# Step sorting & precedence contract:
# 1. Phase: FINDING (1), REMEDIATION (2), VERIFICATION (3)
# 2. Within phase: Operation rank
# 3. Within operation: system_id ASCII ascending
# 4. Within system_id: resource_id ASCII ascending
sorting_order:
  phases:
    FINDING: 1
    REMEDIATION: 2
    VERIFICATION: 3
  remediation_ops:
    DISABLE_DATA_FLOW: 1
    BLOCK_RESTORE: 2
    DELETE_RECORD: 3
    REDACT_RECORD: 4
    ANONYMIZE_RECORD: 5
  verification_ops:
    VERIFY_RECORD_ABSENT: 1
    VERIFY_RECORD_PRESENT: 2
    VERIFY_RECORD_REDACTED: 3
    VERIFY_RECORD_ANONYMIZED: 4
    VERIFY_DATA_FLOW_DISABLED: 5
    VERIFY_RESTORE_BLOCKED: 6

# G2.2 Rule Grounding: Classification signals and proving evidence locator for rule_01 to rule_15
rule_grounding:
  rule_01:
    category: USER_PROFILE
    action: DELETE
    condition: Always
    signals: "system_id == 'account_service' or table in ('customer_profiles', 'customer_profiles_primary', 'customer_profiles_failover_replica') or json key '$.service_exports.account_service'"
    proving_locator: "evidence_54 table customer_profiles_failover_replica; evidence_92 $.service_exports.account_service"
    status: GROUNDED
  rule_02:
    category: SECONDARY_IDENTIFIER
    action: DELETE
    condition: Always
    signals: "table in ('secondary_identifiers', 'user_aliases') or column in ('alias_email', 'secondary_phone')"
    proving_locator: "UNGROUNDED (no dedicated secondary identifier table in dataset evidence; aliases tracked via user_audit_log)"
    status: UNGROUNDED
  rule_03:
    category: SEARCH_INDEX_ENTRY
    action: DELETE
    condition: Always
    signals: "system_id == 'search_service' or table in ('customer_search_documents', 'search_documents_primary') or index in ('customer_directory_v3')"
    proving_locator: "evidence_57 table search_documents_primary; evidence_94 line 8; evidence_92 $.service_exports.search_service"
    status: GROUNDED
  rule_04:
    category: CACHE_ENTRY
    action: DELETE
    condition: Always
    signals: "system_id in ('cache_service', 'redis') or resource_id startswith 'cache_'"
    proving_locator: "UNGROUNDED (no cache service evidence present in 94 dataset files)"
    status: UNGROUNDED
  rule_05:
    category: SUPPORT_MESSAGE
    action: REDACT
    condition: "Conversation contains shared customer, agent, or order context that must be retained"
    signals: "system_id == 'support_platform' and (table == 'support_records' or json path '$.service_exports.support_platform.tickets' or log event in ('message_pii_scan', 'support_ticket_read_completed'))"
    proving_locator: "evidence_01 line 15; evidence_92 $.service_exports.support_platform.tickets; evidence_94 line 10"
    status: GROUNDED
  rule_06:
    category: SUPPORT_ATTACHMENT
    action: DELETE
    condition: "Attachment belongs only to the deletion subject"
    signals: "system_id == 'support_platform' and (file extension == '.pdf' or document heading 'delivery_correction_attachment' or log token 'SUPPORT_ATTACHMENT' or replica check 'marker_found=false')"
    proving_locator: "evidence_58 page 1; evidence_61 line 6; evidence_03 line 43"
    status: GROUNDED
  rule_07:
    category: ANALYTICS_PROFILE
    action: ANONYMIZE
    condition: "Record is still attributable to a user"
    signals: "system_id == 'analytics_platform' and (table == 'customer_analytics_profiles' or json path '$.service_exports.analytics_platform.profiles' or text token 'ANALYTICS_PROFILE') and audience_cohort / general_shopper attributes present"
    proving_locator: "evidence_93 table customer_analytics_profiles; evidence_92 $.service_exports.analytics_platform.profiles; evidence_56 $.records"
    status: GROUNDED
  rule_08:
    category: PRODUCT_TELEMETRY
    action: ANONYMIZE
    condition: "Record is still attributable to a user"
    signals: "log token 'telemetry_flushed' in lambda extension logs"
    proving_locator: "UNGROUNDED (cloud_runtime_export logs contain aggregate lambda telemetry with no attributable user identifier)"
    status: UNGROUNDED
  rule_09:
    category: USER_EXPORT
    action: DELETE
    condition: Always
    signals: "system_id == 'export_service' or table == 'customer_exports' or json path '$.service_exports.export_service.exports' or filename *.zip"
    proving_locator: "evidence_59 $.records; evidence_92 $.service_exports.export_service.exports; evidence_93 table customer_exports"
    status: GROUNDED
  rule_10:
    category: MARKETING_PROFILE
    action: DELETE
    condition: Always
    signals: "system_id == 'analytics_platform' and event == 'contact_lookup_completed' with field email_opt_in"
    proving_locator: "evidence_01 line 92"
    status: GROUNDED
  rule_11:
    category: EMAIL_DELIVERY_LOG
    action: REDACT
    condition: "Log contains a user email address"
    signals: "system_id in ('email_service', 'smtp_service') or table == 'email_delivery_logs'"
    proving_locator: "UNGROUNDED (no dedicated email delivery log evidence file present in dataset)"
    status: UNGROUNDED
  rule_12:
    category: SECURITY_AUDIT_LOG
    action: RETAIN
    condition: "Record is within the supplied retention period"
    signals: "system_id == 'security_service' or table == 'security_audit_records' or json path '$.service_exports.security_service.audit_records' or column retention_until"
    proving_locator: "evidence_01 line 33; evidence_92 $.service_exports.security_service.audit_records; evidence_93 table security_audit_records"
    status: GROUNDED
  rule_13:
    category: LEGAL_HOLD_RECORD
    action: RETAIN
    condition: "A supplied legal hold is active"
    signals: "table in ('legal_holds', 'compliance_holds') or column hold_status == 'ACTIVE'"
    proving_locator: "UNGROUNDED (no legal hold tables or active legal holds in dataset evidence)"
    status: UNGROUNDED
  rule_14:
    category: BACKUP_ARCHIVE
    action: RETAIN
    condition: "Restore access can be blocked"
    signals: "system_id == 'backup_service' or table == 'backup_restore_entries' or json path '$.service_exports.backup_service.restore_entries' or column restore_allowed"
    proving_locator: "evidence_01 line 53; evidence_93 table backup_restore_entries; evidence_92 $.service_exports.backup_service.restore_entries"
    status: GROUNDED
  rule_15:
    category: ACCOUNT_TOMBSTONE
    action: REDACT
    condition: "Account is deleted and only a stable internal user_id is needed to preserve references to retained records"
    signals: "system_id == 'identity_service' or resource_id startswith 'tombstone_' or (account_status == 'DELETED' and subject_reference is present)"
    proving_locator: "evidence_51 JSON $.snapshots[1].records"
    status: GROUNDED
